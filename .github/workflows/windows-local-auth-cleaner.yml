name: Build Windows Local Auth Cleaner

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create/update (e.g. v0.1.0 or latest)"
        required: false
        default: "latest"
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
      - "windows-local-auth-cleaner-v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows_local_auth_cleaner

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows_local_auth_cleaner/pyproject.toml

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build terminal executable
        run: >-
          pyinstaller --noconfirm --clean --onefile
          --name windows-local-auth-cleaner
          --collect-all textual
          --hidden-import browser_cleaner.textual_app
          main.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-local-auth-cleaner
          path: windows_local_auth_cleaner/dist/windows-local-auth-cleaner.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag_name }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'
          } elseif ('${{ github.event.release.tag_name }}') {
            '${{ github.event.release.tag_name }}'
          } else {
            'latest'
          }

          if (-not $tag) { $tag = 'latest' }

          $exists = gh release view $tag 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Updating existing release $tag with binary..."
            gh release upload $tag "dist/windows-local-auth-cleaner.exe" --clobber
          } else {
            Write-Host "Creating new release $tag and uploading binary..."
            gh release create $tag "dist/windows-local-auth-cleaner.exe" --title "Windows Local Auth Cleaner $tag" --generate-notes
          }
